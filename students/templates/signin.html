<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>
</head>

<body>

    <h1 style="text-align: center;">Sign In</h1>

    <center>

        {% if error %}
            <p style="color: red;">
                {{ error }}
            </p>
        {% endif %}

        <form action="{% url 'signin' %}" method="POST">

            {% csrf_token %}

            <label for="username">Username</label>

            <input
                type="text"
                name="username"
                id="username"
                required
            >

            <br><br>


            <label for="password">Password</label>

            <input
                type="password"
                name="password"
                id="password"
                required
            >

            <br><br>


            <input
                type="submit"
                value="Sign In"
            >

        </form>

        <br>

        <a href="{% url 'send_otp' %}">
            Forgot Password?
        </a>

        <br><br>

        <a href="{% url 'signup' %}">
            Don't have an account? Sign Up
        </a>

    </center>

</body>

</html>
