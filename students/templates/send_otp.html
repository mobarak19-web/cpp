
{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h2>Send OTP</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{% url 'send_otp' %}">
        {% csrf_token %}

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <button type="submit">Send OTP</button>

    </form>

</div>

{% endblock %}
