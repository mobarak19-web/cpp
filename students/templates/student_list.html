{% extends 'base.html'%}
{% block content %}

<h2>Student list</h2>


 <a href="{% url 'add_student' %}" class="btn btn-success mb-3" >Add student </a>

<table class="table table-bordered table-striped align-middle w-100">
   
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
        <th>Semester</th>
        <th>Age</th>
        <th>Action</th>
    </tr>
    {% for student in students %}
    <tr>
        <td>{{student.name}}</td>
        <td>{{student.email}}</td>
        <td>{{student.course}}</td>
        <td>{{student.semester}}</td>
        <td>{{student.age}}</td>

        <td>
            <a href="{% url 'edit_student' student.id %}" class="btn btn-primary btn-sm">Edit</a>
            <a href="{% url 'delete_student' student.id %}" class="btn btn-danger btn-sm">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
