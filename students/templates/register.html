{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="text-center fw-bold mb-4">Create an Account</h3>
                
                <form method="POST">
                    {% csrf_token %}
                     
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors|striptags }}
                            </div>
                        {% endif %}
                    </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3 fw-semibold">Sign Up</button>
                </form>

                <hr class="my-4">
                <p class="text-center mb-0 text-muted">
                    Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
