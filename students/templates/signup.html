<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>
</head>
 
<body>

    <h1 style="text-align: center;">Create Account</h1>

    <center>

        <form action="{% url 'signup' %}" method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Sign Up
            </button>

        </form>

        <br>

        <a href="{% url 'signin' %}">
            Already have an account? Sign In
        </a>

    </center>

</body>

</html>
